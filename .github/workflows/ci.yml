name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features
      # The timezone reader's differential sweep is #[ignore]d because it
      # needs the host's /usr/share/zoneinfo and a Python to disagree with —
      # neither of which `cargo test` should depend on. CI has both, so it
      # opts in: 598 zones x 12 instants against python's zoneinfo, which is
      # what stands in for Miri on a module that has no unsafe to verify.
      - name: localtime — the whole tz database vs python zoneinfo
        run: cargo test --release --bin sasso -- --ignored --nocapture

  # We ship Windows binaries and carry Windows-only code paths, and until
  # now no job had ever compiled one (#85). `src/localtime` made that
  # concrete: its `#[cfg(not(unix))]` arm had never been type-checked, let
  # alone run. This job is deliberately the WHOLE suite rather than a
  # smoke test — a narrower one would answer only the question we already
  # knew to ask.
  windows:
    name: windows (build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release
      # `--no-fail-fast` because the first run stopped at the library unit
      # tests and never reached a single integration suite — on a platform
      # where none of them had ever run. Learning what breaks is the point.
      #
      # The two skips are by NAME, not `--skip arena`, so the next arena
      # failure still fails this job. Both are #145: the disjoint-regions
      # test holds 32 threads at a barrier and each reserves 2 GiB, so it
      # asks Windows for 64 GiB of address space and about half the threads
      # fall back to the system allocator — supported behaviour that the
      # test counts as a shared region. Unproven until instrumented, which
      # is why it is an issue and not a fix.
      - name: test
        run: >
          cargo test --release --no-fail-fast --
          --skip arena::tests::concurrent_threads_get_disjoint_regions_and_release_them
          --skip arena::tests::a_thread_that_found_the_registry_full_recovers_when_a_slot_frees
      # The one behaviour that differs by platform rather than merely
      # needing to work on it: with no tz database to read, the compile
      # line keeps its text and drops its timestamp.
      - name: --update narrates without a timestamp
        shell: pwsh
        run: |
          Set-Content -Path one.scss -Value 'a {b: c}'
          $out = & ./target/release/sasso.exe --no-source-map --update one.scss:one.css
          Write-Host "stdout: $out"
          if ($out -notmatch 'Compiled one\.scss to one\.css\.$') {
            throw "expected dart's wording, got: $out"
          }
          if ($out -match '^\[') {
            throw "no tz database is readable here, so there should be no stamp: $out"
          }

  parity:
    name: dart-sass parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: install dart-sass
        # Pinned like sass-spec (spec/SPEC_VERSION.txt): bump this together
        # with a behavior catch-up (and the sass-spec pin + BASELINE.json),
        # never ad hoc — an unpinned latest turns every upstream behavior
        # change into red CI on unrelated PRs.
        run: npm install -g sass@1.104.1
      - name: parity tests vs dart-sass
        run: SASSO_PARITY=1 SASS_BIN=sass cargo test --test parity -- --nocapture

  wasm:
    name: wasm32-wasip1 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: build (lib) for wasm
        run: cargo build --lib --target wasm32-wasip1

  wasm-npm:
    name: wasm npm package (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm
          cache-directories: |
            wasm/target-size
            wasm/target-speed
      - name: install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # The wasm crate lives outside the core workspace, so fmt/clippy run inside
      # wasm/ (the root `cargo fmt --all` / `--all-targets` don't reach it).
      - name: rustfmt (wasm)
        run: cargo fmt --check
        working-directory: wasm
      - name: clippy (wasm)
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
        working-directory: wasm
      # Build BOTH wasm variants (size + speed), then exercise the full JS API
      # surface — compileString/compile/async, source maps, the Compiler API,
      # and the importer bridge (loadPaths, relative, user Importer/FileImporter).
      - name: build wasm modules
        run: bash wasm/build.sh
      - name: node API + importer tests
        run: node wasm/test.mjs

  napi:
    name: native addon (build + parity + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            napi
            wasm
          cache-directories: |
            wasm/target-size
            wasm/target-speed
      - name: install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Like wasm/ and ffi/, the napi crate lives outside the core workspace.
      - name: rustfmt (napi)
        run: cargo fmt --check
        working-directory: napi
      - name: clippy (napi)
        run: cargo clippy --release -- -D warnings
        working-directory: napi
      # The parity half of napi/test.mjs compiles every corpus with BOTH
      # engines and asserts byte-identical CSS, so the wasm modules must exist.
      - name: build wasm modules (parity reference)
        run: bash wasm/build.sh
      - name: build native addon
        run: bash napi/build.sh
      # napi/ is its OWN workspace and its lockfile is tracked (the addon ships
      # prebuilt binaries, so its dependency set is pinned like the root
      # crate's). It pins the core crate BY PATH, so a release that bumps
      # Cargo.toml leaves this lockfile stale and the build above quietly
      # rewrites a tracked file — twice now, unnoticed both times. Fail instead:
      # a version bump has to carry the refreshed lockfile.
      # (wasm/Cargo.lock is deliberately untracked — see wasm/.gitignore.)
      - name: napi/Cargo.lock is not stale
        run: git diff --exit-code napi/Cargo.lock
      - name: node parity + behavior tests
        run: node napi/test.mjs

  ffi:
    name: C ABI (ffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi
      # The ffi crate lives outside the core workspace, so fmt/clippy/build run
      # inside ffi/ (the root `cargo fmt --all` / `--all-targets` don't reach it).
      - name: rustfmt (ffi)
        run: cargo fmt --check
        working-directory: ffi
      - name: clippy (ffi)
        run: cargo clippy --release --all-targets -- -D warnings
        working-directory: ffi
      - name: build cdylib + staticlib
        run: cargo build --release
        working-directory: ffi
      - name: python ctypes smoke test
        run: python3 examples/smoke.py
        working-directory: ffi
      - name: python ctypes custom-importer test
        run: python3 examples/importer.py
        working-directory: ffi

  nix:
    name: nix flake
    # Both platform families `meta.platforms = unix` claims. The macOS leg is
    # not redundant: `buildRustPackage`, the install checks and the sandbox
    # itself differ enough there that a Linux-only check has let a broken
    # darwin build through before in other projects.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      # Builds nix/package.nix (full `cargo test` in the sandbox) and
      # nix/ffi.nix (the C ABI's ctypes smoke test against the installed
      # library), then the dart-compat check — issue #82's flag set, compared
      # byte-for-byte against the dart-sass our flake.lock pins. Everything is
      # pinned by flake.lock, so this job never goes red on someone else's bump.
      - name: nix flake check
        run: nix flake check -L --show-trace

      # NUR's own evaluation check, from nix-community/NUR's README. `nix flake
      # check` cannot stand in for it: this one forbids eval-time network access,
      # which is the single constraint nix/nur.nix exists to satisfy, and it
      # resolves nixpkgs unstable rather than our flake.lock, which is what NUR
      # evaluates against. Worth a job because the failure is silent — NUR keeps
      # the last revision that evaluated, so a break would leave users quietly
      # on an older sasso with nothing to read. Linux only: NUR's evaluator is.
      - name: NUR evaluation check
        if: runner.os == 'Linux'
        run: |
          nixpkgs=$(nix-instantiate --find-file nixpkgs 2>/dev/null \
            || nix flake prefetch nixpkgs --json \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["storePath"])')
          echo "nixpkgs = $nixpkgs"
          nix-env -f nix/nur.nix -qa '*' --meta --drv-path --show-trace \
            --option restrict-eval true \
            --option allow-import-from-derivation true \
            -I nixpkgs="$nixpkgs" -I ./ | tee attrs.txt
          grep -qE '^sasso-[0-9]' attrs.txt
          grep -qE '^sasso-ffi-[0-9]' attrs.txt

  conformance:
    name: sass-spec ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fetch sass-spec
        run: bash spec/fetch.sh
      - name: build release
        run: cargo build --release
      - name: pass-rate ratchet (must not regress below spec/BASELINE.json)
        run: python3 spec/check_baseline.py
      - name: failure summary by bucket (informational)
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, os
          from collections import Counter
          path = os.path.join('spec', 'results.json')
          if not os.path.exists(path):
              print('no results.json'); raise SystemExit(0)
          cases = json.load(open(path))['cases']
          fails = [c['name'] for c in cases if c['status'] == 'FAIL']
          print(f"FAIL total: {len(fails)}")
          buckets = Counter('/'.join(n.replace(':', '/').split('/')[:3]) for n in fails)
          for k, v in buckets.most_common(30):
              print(f"{v:5} {k}")
          PYEOF
      - name: upload results.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sass-spec-results-linux
          path: spec/results.json
          if-no-files-found: ignore
