[package]
name = "sasso"
version = "0.17.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "A pure-Rust SCSS to CSS compiler (a dart-sass alternative). Zero dependencies, wasm-friendly, embeddable as a library and usable as a CLI."
homepage = "https://github.com/momiji-rs/sasso"
repository = "https://github.com/momiji-rs/sasso"
documentation = "https://docs.rs/sasso"
readme = "README.md"
keywords = ["sass", "scss", "css", "compiler", "wasm"]
categories = ["compilers", "web-programming"]
# Keep the published crate lean: ship only the library, binary, examples,
# tests, licenses and README — not the conformance harness, benchmarks, or
# analysis docs (those live in the git repo).
exclude = ["/bench", "/spec", "/docs", "/.github", "/wasm", "/ffi", "/nix", "flake.nix", "flake.lock"]

[lib]
name = "sasso"
path = "src/lib.rs"

# Default binary, auto-detected from src/main.rs, named `sasso`.
[[bin]]
name = "sasso"
path = "src/main.rs"

# Intentionally zero runtime dependencies: pure std, so the crate is
# trivially wasm32-wasip1 / wasm32-unknown-unknown friendly and embeds
# into a sandbox (rubyrs Tier-1) without pulling a single native -sys
# crate. The whole pipeline (scan -> parse -> eval -> emit) and the CLI
# (a hand-rolled arg parser) are std-only.
[dependencies]

[features]
default = []

[profile.release]
# `panic = "abort"` is set EXPLICITLY, the way `ffi/` sets `unwind` and `wasm/`
# sets `abort`: of the four manifests in this repo the core was the one that had
# never said, and that silence was an inconsistency rather than a decision (the
# fourth, `napi/`, now records why it keeps unwinding). Nothing outside
# `#[cfg(test)]` unwinds — the crate's only `catch_unwind` is in `arena`'s test
# module — and Cargo ignores the `panic` setting for the `test` and `bench`
# profiles, so `cargo test --release` and the CodSpeed benches keep unwinding
# and `arena::tests::pause_guard_lifts_on_unwind` still works. Profiles apply
# to this workspace only, so a crate that depends on `sasso` is unaffected.
panic = "abort"
lto = "thin"
codegen-units = 1
# The release binary carries no debug info to begin with, so this only drops
# the symbol table: it is a download-size change, not a speed one, and `ffi/`
# and `wasm/` already do it. Costs a symbolized panic backtrace, which the CLI
# never relies on (every user-facing error goes through `Display`).
strip = true

# The profile that 'dist' will build with
[profile.dist]
# `panic`, `strip` and `codegen-units` come from `release` above by
# inheritance; `lto` is restated so this profile reads on its own.
inherits = "release"
lto = "thin"

# Modern lint posture, expressed in-manifest so every target (lib, bin, tests,
# examples) inherits it and CI/clippy stay consistent. `unsafe_code` is `deny`
# (not `forbid`) so the single audited `arena` module — the scoped bump
# allocator (perf #5), verified by unit tests + Miri — can `#[allow]` it; every
# other module stays unsafe-free.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

# The `sasso` package is its own workspace root. The wasm-export wrapper
# (`/wasm`, a cdylib that needs `unsafe` for its FFI exports) is kept OUT of
# this workspace so the core crate keeps `unsafe_code = "forbid"`.
[workspace]
exclude = ["wasm", "ffi", "napi"]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# The tap the generated formula names in its download URLs and is destined for.
# `publish-jobs` deliberately does NOT include "homebrew": that job pushes the
# formula into the tap from here, which needs a cross-repo write token
# (`HOMEBREW_TAP_TOKEN`) held as a secret in this repo. Setting `tap` alone is
# enough to make `dist` emit `sasso.rb` as a release artifact, checksums filled
# in; momiji-rs/homebrew-tap then PULLS that artifact from the public release
# API and commits it with its own built-in GITHUB_TOKEN. Same formula, no
# cross-repo secret anywhere. `dist plan` warns about the disabled publish job
# — that warning is this choice, not a misconfiguration.
tap = "momiji-rs/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Don't emit cargo-dist's own source archive: its filename is hardcoded to the
# generic `source.tar.gz`, which is confusing for downstream packagers (e.g. the
# FreeBSD ports tree). release-source.yml attaches a conventionally-named
# `sasso-<version>.tar.xz` instead.
source-tarball = false
# release.yml is intentionally hand-edited: the tag trigger is narrowed to
# `v[0-9]+...` so the decoupled `npm-v*` line (release-wasm.yml) does NOT fire
# here. Tell `dist plan` not to fail its generated-file freshness check on it.
allow-dirty = ["ci"]

[dev-dependencies]
divan = { version = "5.0.0", package = "codspeed-divan-compat" }

# CodSpeed performance benchmarks for the SCSS -> CSS pipeline. The `divan`
# dependency above is the CodSpeed compatibility layer, which keeps the upstream
# divan API and adds CPU-simulation instrumentation under cargo-codspeed.
[[bench]]
name = "compile"
harness = false
